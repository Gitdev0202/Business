name: MacBook Marktplaats Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macbook-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POSTCODE: "9678"
          DISTANCE_KM: "28"
          MIN_PRICE_EUR: "200"
        run: python scripts/monitor_macbooks.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "macbook-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_macbooks.json
          git diff --cached --quiet || git commit -m "Update seen listings (MacBooks)"
                    for i in 1 2 3 4 5; do
            git push && break
            echo "Push mislukt (poging $i), opnieuw proberen na rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
