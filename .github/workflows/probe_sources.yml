name: Probe extra bronnen (eenmalig, handmatig)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe AutoScout24 / Gaspedaal / AutoTrack
        run: python scripts/probe_sources.py
