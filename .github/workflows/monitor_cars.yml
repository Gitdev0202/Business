name: Auto-inkoop Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cars-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          # Bewust GEEN POSTCODE/DISTANCE_KM: heel Nederland, zowel voor de
          # mediaan-referentie als voor meldingen (zie docstring in
          # scripts/monitor_cars.py). Zet ze hier alsnog neer om lokaal te
          # beperken.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_PRICE_EUR: "10000"
          MIN_PRICE_EUR: "1500"
          DISCOUNT_THRESHOLD_PCT: "15"
          MIN_GROUP_SIZE: "4"
          MAX_MILEAGE_KM: "150000"
          MIN_CONSTRUCTION_YEAR: "2005"
          MAX_MILEAGE_DEVIATION_KM: "50000"
          MAX_YEAR_DEVIATION: "4"
        run: python scripts/monitor_cars.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "cars-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_cars.json
          git diff --cached --quiet || git commit -m "Update seen listings (cars)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push mislukt (poging $i), opnieuw proberen na rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
