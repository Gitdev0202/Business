name: PS5 Marktplaats Monitor

on:
  # GEPAUZEERD (5-10-2026): GitHub Actions' eigen runner-wachtrij liep vast
  # (jobs kregen geen runner toegewezen en werden na 15 min automatisch
  # geannuleerd door GitHub zelf, niet door dit script) -- dit gaf continu
  # mislukte-run-meldingen. Cron tijdelijk uit, workflow_dispatch blijft
  # staan. Wordt automatisch weer aangezet zodra GitHub's runners hersteld
  # zijn bevestigd (zie sessie-notitie); handmatig hervatten kan ook door
  # het "#" bij "schedule:"/"- cron: ..." weg te halen.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ps5-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_PRICE_EUR: "250"
          POSTCODE: ${{ secrets.POSTCODE }}
          DISTANCE_KM: "28"
        run: python scripts/monitor.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "ps5-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_ps5.json
          git diff --cached --quiet || git commit -m "Update seen listings"
                    for i in 1 2 3 4 5; do
            git push && break
            echo "Push mislukt (poging $i), opnieuw proberen na rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 2))
          done
