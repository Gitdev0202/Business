name: Horloge Koopjes Monitor

on:
  # GEPAUZEERD (5-10-2026): GitHub Actions' eigen runner-wachtrij liep vast
  # (jobs kregen geen runner toegewezen en werden na 15 min automatisch
  # geannuleerd door GitHub zelf, niet door dit script) -- dit gaf continu
  # mislukte-run-meldingen. Cron tijdelijk uit, workflow_dispatch blijft
  # staan. Wordt automatisch weer aangezet zodra GitHub's runners hersteld
  # zijn bevestigd (zie sessie-notitie); handmatig hervatten kan ook door
  # het "#" bij "schedule:"/"- cron: ..." weg te halen.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 50km straal (bewust gekozen ondanks dat dit weinig aanbod geeft
          # voor de huidige curated modellenlijst -- leeg laten zou heel
          # Nederland betekenen).
          POSTCODE: ${{ secrets.POSTCODE }}
          DISTANCE_KM: "50"
          ASKING_MIN_EUR: "400"
          ASKING_MAX_EUR: "2500"
          NEGOTIATION_BUFFER_EUR: "150"
          MIN_MARGIN_EUR: "100"
        run: python scripts/monitor_watches.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "watch-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_watches.json
          git diff --cached --quiet || git commit -m "Update seen listings (watches)"
          git push
