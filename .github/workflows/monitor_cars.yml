name: Auto-inkoop Monitor

on:
  # 1x per 6 uur (bewust niet op het hele of halve uur, zie CLAUDE-conventie
  # elders in dit account). Dit is een bewust LANGE, grondige run (tot 20
  # pagina's per model per bron, met beleefde pauzes) -- vandaar de lage
  # frequentie i.p.v. de 5-minuten-cadans van de andere monitors.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cars-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Ruim boven de verwachte looptijd (grondige diepe paginering + beleefde
    # pauzes kan lang duren) -- voorkomt dat GitHub de run halverwege afbreekt.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          # POSTCODE (gedeelde secret, Winschoten) + DISTANCE_KM beperken
          # ALLEEN de meld-groep (kansen) tot deze straal. De mediaan-
          # referentiegroep blijft altijd heel Nederland, ongeacht deze
          # instelling -- zie docstring in scripts/monitor_cars.py.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POSTCODE: ${{ secrets.POSTCODE }}
          # Was 50 km: de run-logs van 29-9-2026 lieten zien dat 50 km rond
          # Winschoten maar 1.007 lokale advertenties opleverde (tegenover
          # 22.255 landelijk) -- veruit de grootste reden voor weinig
          # meldingen. 70 km dekt een fors groter deel van Noord-Nederland.
          DISTANCE_KM: "70"
          MAX_PRICE_EUR: "10000"
          MIN_PRICE_EUR: "1500"
          # Was 15%: iets soepeler zodat ook duidelijke (maar minder extreme)
          # kansen worden gemeld, i.p.v. alleen de allergrootste uitschieters.
          DISCOUNT_THRESHOLD_PCT: "10"
          MIN_GROUP_SIZE: "4"
          MAX_MILEAGE_KM: "150000"
          MIN_CONSTRUCTION_YEAR: "2005"
          MAX_MILEAGE_DEVIATION_KM: "50000"
          MAX_YEAR_DEVIATION: "1"
          # Beide iets soepeler dan de oorspronkelijke 20%/5% (zelfde reden
          # als DISCOUNT_THRESHOLD_PCT hierboven).
          MILEAGE_DISCOUNT_THRESHOLD_PCT: "15"
          MAX_PRICE_PREMIUM_FOR_MILEAGE_SIGNAL_PCT: "8"
        run: python scripts/monitor_cars.py

      - name: Commit bijgewerkte state
        run: |
          git config user.name "cars-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- state/seen_cars.json; then
            echo "Geen nieuwe kansen, niets te committen."
            exit 0
          fi

          # Bewaar ONZE nieuw gevonden entries apart. Deze run kan (door de
          # bewust lange looptijd, tot enkele uren) makkelijk overlappen met
          # een andere push naar main die state/seen_cars.json ook wijzigde
          # -- een gewone git-rebase kan zo'n content-conflict in JSON niet
          # automatisch oplossen. In plaats daarvan doen we bij een conflict
          # een SEMANTISCHE merge (samenvoegen van de twee JSON-dicts) i.p.v.
          # een tekstuele git-merge.
          cp state/seen_cars.json /tmp/cars_state_ours.json

          for i in 1 2 3 4 5; do
            git add state/seen_cars.json
            git commit -m "Update seen listings (cars)"
            if git push; then
              echo "Gepusht."
              exit 0
            fi
            echo "Push mislukt (poging $i), state semantisch samenvoegen met de nieuwste main..."
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/merge_cars_state.py /tmp/cars_state_ours.json state/seen_cars.json
            sleep $((RANDOM % 8 + 2))
          done
          echo "Kon na 5 pogingen niet pushen." >&2
          exit 1
